sonar.projectKey=crusty0530_Dumpd
sonar.organization=crusty0530

# Where code and tests live
sonar.sources=backend
sonar.exclusions=**/*_test.go
sonar.tests=backend
sonar.test.inclusions=**/*_test.go

# Go coverage report from CI
sonar.go.coverage.reportPaths=backend/coverage.out

# main.go is just wiring; don't count it against coverage
sonar.coverage.exclusions=backend/cmd/**